name: patches apply

# Do the patches still apply to their pinned upstream commits? Fetches only those
# commits (no GPU, no build), every push and pull request and once a week, so an upstream
# commit that disappears or a patch that no longer fits shows up here first.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pinned commits
        run: |
          echo "SGLANG_COMMIT=$(sed -n 's/^SGLANG_COMMIT=\([0-9a-f]*\).*/\1/p' setup.sh)" >> "$GITHUB_ENV"
          echo "KT_COMMIT=$(sed -n 's/^KT_COMMIT=\([0-9a-f]*\).*/\1/p' setup.sh)" >> "$GITHUB_ENV"

      - name: sglang
        run: |
          git init -q sglang && cd sglang
          git fetch -q --depth 1 https://github.com/sgl-project/sglang.git "$SGLANG_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SGLANG_COMMIT"
          # tier 0 and tier 0.5 (the GGUF format, after its two headers copied as setup.sh does),
          # then each tier-1 feature without prerequisites alone on them
          for t in ../patches/sglang-tier0/[0-9][0-9]-*.patch; do
            git apply --whitespace=nowarn "$t"
          done
          mkdir -p python/sglang/srt/layers/moe/kt_gguf_moe_multi
          cp python/sglang/kernels/jit/include/sgl_kernel/quantization/gguf/{ggml-common.h,vecdotq.cuh} \
            python/sglang/srt/layers/moe/kt_gguf_moe_multi/
          for t in ../patches/sglang-tier0.5/[0-9][0-9]-*.patch; do
            git apply --whitespace=nowarn "$t"
          done
          for f in ../patches/sglang-tier1/[0-9][0-9]-*.patch; do
            slug=$(basename "$f" .patch); slug=${slug#[0-9][0-9]-}
            grep -q "^$slug:" ../patches/sglang-tier1/requires.txt && continue
            git apply --check --whitespace=nowarn "$f"
          done
          # all of tier 1 in order, then tier 2
          for f in ../patches/sglang-tier1/[0-9][0-9]-*.patch ../patches/sglang-tier2-no-p2p.patch; do
            git apply --whitespace=nowarn "$f"
          done
          # stream-mmq's llama.cpp sources: fetched, patched and checked byte for byte
          bash ../lib/llama-mmq.sh . ../llama-mmq-clone
          # the optional patches each fit on the full stack
          for f in ../patches/sglang-optional/[0-9][0-9]-*.patch; do
            git apply --check --whitespace=nowarn "$f"
          done

      - name: SM89 dispatch contracts (CPU only)
        run: python3 tools/test_sm89_dispatch.py sglang

      - name: CPU tests
        run: |
          # no torch needed
          python3 tools/test_qualify_cache.py
          python3 tools/lend-transition-fences-test.py
          # CPU torch and Triton; the Triton kernels run in Triton's interpreter
          python3 -m venv ../cpu-venv
          ../cpu-venv/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu torch
          ../cpu-venv/bin/pip install -q triton numpy
          ../cpu-venv/bin/python tools/e4m3-emulation-test.py
          S=sglang/python/sglang/kernels/ops/attention
          # live top-k (tier 1) against torch's selection rule
          cat $S/dsv4/live_topk.py tools/test_live_topk.py \
            | CUDA_VISIBLE_DEVICES= TRITON_INTERPRET=1 ../cpu-venv/bin/python -
          # the fused merge+sink (sglang-optional/01) against the torch chain
          git -C sglang apply --whitespace=nowarn ../patches/sglang-optional/01-sm89-fused-merge.patch
          cat $S/flash_mla_sm120_triton.py tools/test_merge_sink.py \
            | CUDA_VISIBLE_DEVICES= TRITON_INTERPRET=1 KT_SM89_FUSED_MERGE=1 ../cpu-venv/bin/python -
          git -C sglang apply -R --whitespace=nowarn ../patches/sglang-optional/01-sm89-fused-merge.patch

      - name: ktransformers and its llama.cpp
        run: |
          git init -q kt && cd kt
          git fetch -q --depth 1 https://github.com/kvcache-ai/ktransformers.git "$KT_COMMIT"
          git checkout -q FETCH_HEAD
          git apply --whitespace=nowarn ../patches/kt-kernel-tree.patch
          # the cpu-gpu-overlap feature's kt-kernel patch sits on the tree patch
          git apply --check --whitespace=nowarn ../patches/kt-kernel-cpu-handoff.patch
          # the expert-cache feature's kt-kernel patch fits on the tree patch, with or without the hand-off,
          # and so do the GGUF patches (kt-kernel-gguf, then the kt-llamafile kernels and the kernel guard)
          git apply --check --whitespace=nowarn ../patches/kt-kernel-expert-cache.patch
          git apply --check --whitespace=nowarn ../patches/kt-kernel-gguf.patch
          git apply --whitespace=nowarn ../patches/kt-kernel-cpu-handoff.patch
          git apply --check --whitespace=nowarn ../patches/kt-kernel-expert-cache.patch
          git apply --check --whitespace=nowarn ../patches/kt-kernel-gguf.patch
          git apply --whitespace=nowarn ../patches/kt-kernel-expert-cache.patch
          git apply --whitespace=nowarn ../patches/kt-kernel-gguf.patch
          git apply --whitespace=nowarn ../patches/kt-llamafile-iq2xs.patch
          git apply --whitespace=nowarn ../patches/kt-llamafile-iquants.patch
          git apply --whitespace=nowarn ../patches/kt-llamafile-iq4lut.patch
          git apply --whitespace=nowarn ../patches/kt-kernel-gguf-kernel-guard.patch
          llama=$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')
          git init -q ../llama && cd ../llama
          git fetch -q --depth 1 https://github.com/ggerganov/llama.cpp.git "$llama"
          git checkout -q FETCH_HEAD
          git apply --check --whitespace=nowarn ../patches/kt-kernel-llama-cpp.patch

      - name: scripts
        run: |
          for f in setup.sh serve.sh lib/*.sh tools/*.sh; do bash -n "$f"; done
          python3 -m py_compile tools/*.py lib/*.py engram-adapter/*.py patches/*.py
