name: prebuilt host
description: >
  A build host for tools/prebuilt-pack.sh on an Ubuntu 24.04 runner: room on the disk, CUDA 13.1's
  compiler, cudart, driver stub and cuBLAS headers from NVIDIA's apt repository, libnuma and hwloc
  headers, Python 3.12 with uv, then `PREPARE_ONLY=1 ./setup.sh` (the pinned trees with the patches
  and the venv with the pinned torch; nothing built).
runs:
  using: composite
  steps:
    - name: room on the disk
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        df -h / | tail -1
    - name: CUDA 13.1 toolkit (compiler, cudart, driver stub, cuBLAS headers), libnuma, hwloc
      shell: bash
      run: |
        curl -sSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
        sudo dpkg -i cuda-keyring_1.1-1_all.deb
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends \
          cuda-compiler-13-1 cuda-cudart-dev-13-1 cuda-driver-dev-13-1 libcublas-dev-13-1 \
          libnuma-dev libhwloc-dev pkg-config cmake ninja-build
        "$CUDA_HOME/bin/nvcc" --version | tail -1
        ls "$CUDA_HOME/lib64/stubs/libcuda.so" "$CUDA_HOME/include/cublas_v2.h"
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
    - name: trees and venv (PREPARE_ONLY=1 ./setup.sh)
      shell: bash
      run: PREPARE_ONLY=1 ./setup.sh
    - name: what is on the disk
      shell: bash
      run: df -h / | tail -1
